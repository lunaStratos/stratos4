name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 포맷·린트는 한 번만 돌린다.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 리눅스 GUI 빌드 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets -- -D warnings

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: macos-arm64
          - os: macos-13        # Intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 빌드 및 패키징 (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build.sh mac

      - name: 빌드 (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: 패키징 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\stratos-dl.exe dist\
          Compress-Archive -Path dist\stratos-dl.exe `
            -DestinationPath "dist\stratos-dl-$version-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: stratos-dl-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      # 압축을 풀지 않고 바로 실행할 수 있도록 .exe 도 따로 올린다.
      - name: exe 업로드 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stratos-dl-exe
          path: dist/stratos-dl.exe
          if-no-files-found: error

  # 태그를 푸시하면 릴리스를 만들고 결과물을 붙인다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 결과물 모으기
        run: |
          mkdir -p dist
          find artifacts \( -name '*.zip' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true

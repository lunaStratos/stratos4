[package]
name = "stratos-dl"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "yt-dlp 기반 크로스플랫폼 다운로더 (macOS / Windows)"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
flate2 = "1.1.10"
open = "5"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
